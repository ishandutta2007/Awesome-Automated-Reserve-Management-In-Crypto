<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background:#070b14; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="greenLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>

    <style>
      @keyframes pulseOrb1 {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
        100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      }
      @keyframes pulseOrb2 {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
        50% { transform: scale(1.2) translate(-25px, 15px); opacity: 0.5; }
        100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      }
      @keyframes pulseWave {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatPill1 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }
      @keyframes floatPill2 {
        0% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
        100% { transform: translateY(0px); }
      }
      @keyframes nodeFlicker {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.95; }
      }
      .orb-1 { animation: pulseOrb1 8s infinite ease-in-out; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseOrb2 10s infinite ease-in-out; transform-origin: 1000px 300px; }
      .wave-line-1 { stroke-dasharray: 400; animation: pulseWave 12s infinite linear; }
      .wave-line-2 { stroke-dasharray: 300; animation: pulseWave 9s infinite linear reverse; }
      .pill-float-1 { animation: floatPill1 4.5s infinite ease-in-out; }
      .pill-float-2 { animation: floatPill2 5.2s infinite ease-in-out; }
      .pill-float-3 { animation: floatPill1 4.8s infinite ease-in-out 1s; }
      .pill-float-4 { animation: floatPill2 5.5s infinite ease-in-out 1.5s; }
      .pulse-dot { animation: nodeFlicker 2.5s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGlow)" />
  <rect width="1200" height="400" fill="url(#cyberGrid)" />

  <!-- Animated Glowing Orbs (in Background) -->
  <circle class="orb-1" cx="220" cy="120" r="180" fill="url(#orbGlow1)" />
  <circle class="orb-2" cx="980" cy="280" r="220" fill="url(#orbGlow2)" />
  <circle cx="600" cy="360" r="150" fill="url(#orbGlow3)" opacity="0.25" />

  <!-- Dynamic Animated Graphic Wave Lines (Background / Midground) -->
  <path class="wave-line-1" d="M -50 330 C 200 280, 350 370, 600 320 C 850 270, 1000 350, 1250 310" fill="none" stroke="url(#cyanLine)" stroke-width="2.5" />
  <path class="wave-line-2" d="M -50 350 C 250 380, 450 310, 700 360 C 950 410, 1050 310, 1250 340" fill="none" stroke="url(#greenLine)" stroke-width="1.8" />

  <!-- Dynamic Network Nodes & Connected Edges -->
  <g opacity="0.45">
    <line x1="120" y1="80" x2="220" y2="140" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="220" y1="140" x2="320" y2="90" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="880" y1="80" x2="980" y2="130" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="980" y1="130" x2="1080" y2="70" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3" />
    <circle class="pulse-dot" cx="120" cy="80" r="3.5" fill="#38bdf8" />
    <circle class="pulse-dot" cx="220" cy="140" r="4.5" fill="#38bdf8" />
    <circle class="pulse-dot" cx="320" cy="90" r="3" fill="#38bdf8" />
    <circle class="pulse-dot" cx="880" cy="80" r="3" fill="#a78bfa" />
    <circle class="pulse-dot" cx="980" cy="130" r="4.5" fill="#a78bfa" />
    <circle class="pulse-dot" cx="1080" cy="70" r="3.5" fill="#a78bfa" />
  </g>

  <!-- Top Category Chip -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="-138" cy="0" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="6" y="4.5" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1.5">CURATED AWESOME DIRECTORY</text>
  </g>

  <!-- Main Title & Subtitle (High Contrast, Bold, Guaranteed Foreground) -->
  <g transform="translate(600, 126)" text-anchor="middle" filter="url(#dropShadow)">
    <text y="0" fill="url(#titleGrad)" font-size="37" font-weight="800" letter-spacing="0.5">
      AUTOMATED RESERVE MANAGEMENT
    </text>
    <text y="36" fill="#f8fafc" font-size="21" font-weight="600" letter-spacing="2">
      IN CRYPTO &amp; STABLECOINS
    </text>
    <text y="72" fill="#94a3b8" font-size="14.5" font-weight="400" letter-spacing="0.3">
      Algorithmic Rebalancing • Merkle Proof-of-Reserves • Treasury Yield • Collateral Oracles
    </text>
  </g>

  <!-- Interactive Dynamic Floating Status Pills (Foreground) -->
  <!-- Pill 1: Proof of Reserves -->
  <g class="pill-float-1" transform="translate(130, 260)">
    <rect width="215" height="42" rx="21" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" filter="url(#dropShadow)" />
    <circle cx="24" cy="21" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="26" fill="#e2e8f0" font-size="12.5" font-weight="600">Proof of Reserves (PoR)</text>
  </g>

  <!-- Pill 2: Treasury Automation -->
  <g class="pill-float-2" transform="translate(375, 260)">
    <rect width="215" height="42" rx="21" fill="url(#pillGrad1)" stroke="#34d399" stroke-width="1.2" filter="url(#dropShadow)" />
    <circle cx="24" cy="21" r="5" fill="#34d399">
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="26" fill="#e2e8f0" font-size="12.5" font-weight="600">Treasury Automation</text>
  </g>

  <!-- Pill 3: RWA & Yield Vaults -->
  <g class="pill-float-3" transform="translate(620, 260)">
    <rect width="210" height="42" rx="21" fill="url(#pillGrad1)" stroke="#a78bfa" stroke-width="1.2" filter="url(#dropShadow)" />
    <circle cx="24" cy="21" r="5" fill="#a78bfa">
      <animate attributeName="r" values="4;6;4" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="26" fill="#e2e8f0" font-size="12.5" font-weight="600">Tokenized RWA Vaults</text>
  </g>

  <!-- Pill 4: Real-Time Attestation -->
  <g class="pill-float-4" transform="translate(860, 260)">
    <rect width="210" height="42" rx="21" fill="url(#pillGrad1)" stroke="#f59e0b" stroke-width="1.2" filter="url(#dropShadow)" />
    <circle cx="24" cy="21" r="5" fill="#f59e0b">
      <animate attributeName="r" values="4;6;4" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="26" fill="#e2e8f0" font-size="12.5" font-weight="600">On-Chain Attestation</text>
  </g>

  <!-- Subtle bottom border highlight -->
  <line x1="0" y1="399" x2="1200" y2="399" stroke="#334155" stroke-width="1" />
</svg>
